[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "crypter-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
